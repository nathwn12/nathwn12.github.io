name: ai-cards

# Per-repository machine cards, rebuilt from the committed snapshots only.
# The stats workflow measures npm/GitHub figures; the repo and summary probes
# own identity and each repo's own words. This job never calls either probe and
# commits only generated ai/*.json and ai/*.md files.

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-cards
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Generate cards from the committed snapshots
        run: node scripts/gen-ai-cards.mjs

      - name: Assert the generated bytes are stable
        run: node scripts/gen-ai-cards.mjs --check

      - name: Commit only changed generated cards
        run: |
          if git diff --quiet -- ai; then
            echo "ai cards unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/*.json ai/*.md
          git commit -m "chore: refresh the per-repository ai cards"
          git push
