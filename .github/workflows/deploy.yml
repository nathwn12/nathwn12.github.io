name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  # No `paths` or `paths-ignore` filter here. ai/*.md cards are served
  # assets, so a "docs-only" diff can change what users download; no path
  # may be presumed inert. A deploy skipped on a doc change is a stale site.
  push:
    branches: [main]
  schedule:
    - cron: "30 8 * * 1"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      # The committed snapshots are the only source. A scheduled job measures
      # and commits them; a deploy must never overwrite them in memory.
      - run: bun run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
