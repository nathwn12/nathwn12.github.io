# The pull_request trigger stays unfiltered so the required check always
# reports; a docs-only PR skips the work inside the job, not the check itself.
name: docs-report

on:
  # Unfiltered on purpose: a path-filtered required check leaves a PR BLOCKED
  # with "Expected - Waiting for status to be reported".
  pull_request:
  push:
    branches: [main]
    # Ignore pure-doc push diffs. ai/** is a build input, never a doc path;
    # **/*.json, **/*.ts and **/*.mjs stay in scope.
    paths-ignore: ['**/*.md', 'docs/**', 'LICEN[CS]E']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  docs-report:
    runs-on: ubuntu-latest
    steps:
      # First step: read the PR's changed files directly. When every path is a
      # doc path outside ai/, report green and skip all the work below.
      - name: Scope
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docs='^(.*\.md|docs/.*|LICEN[CS]E(\.md)?)$'
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | .filename')
          if [ -n "$changed" ] \
             && ! printf '%s\n' "$changed" | grep -qE '^ai/' \
             && ! printf '%s\n' "$changed" | grep -qvE "$docs"; then
            echo "no code changed: docs only"
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.scope.outputs.code == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.scope.outputs.code == 'true'
        with:
          node-version: '26'
      - name: docs gate (strict)
        if: steps.scope.outputs.code == 'true'
        run: node docs-check.mjs --strict
      - name: link check (offline, report-only)
        if: steps.scope.outputs.code == 'true'
        uses: lycheeverse/lychee-action@f796c8b7d468feb9b8c0a46da3fac0af6874d374 # v2.2.0
        with:
          args: --no-progress --offline '**/*.md'
          fail: false

      - name: Scope report
        if: always()
        run: |
          echo "scope: ${{ steps.scope.outputs.code == 'true' && 'code changed - the full gate ran' || 'no code changed: docs only - check reported green' }}"
