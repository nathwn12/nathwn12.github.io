name: opencode

# DISABLED - the OPENCODE_API_KEY secret exists in this repo (set 2026-04-15)
# but the credential is invalid: opencode.ai/inference returned HTTP 401
# {"error":{"type":"authentication_error","message":"Invalid credential"}}
# for opencode-go/mimo-v2.6-pro, with isRetryable: false. Every issue_comment
# invocation was a red X. Per AGENTS.md the bot stays disabled by owner decision.
#
# The original triggers are commented out below. To re-enable, ONLY with the
# owner's approval: rotate OPENCODE_API_KEY to a valid credential, restore the
# two triggers, and remove the event-name guard on the job.
on:
  workflow_dispatch:
# on:
#   issue_comment:
#     types: [created]
#   pull_request_review_comment:
#     types: [created]

jobs:
  opencode:
    # No event can satisfy this while only workflow_dispatch is registered:
    # the job stays skipped even if someone dispatches it by hand.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@f4e363c8295fa90a03dddc451882fffe8fbce357 # latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/mimo-v2.6-pro
