name: supply-chain

# Free-tier GitHub-hosted check on a public repository.
on:
  schedule:
    - cron: "17 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install from the lockfile
        run: bun install --frozen-lockfile
      - name: Audit dependencies
        # picomatch 4.0.7 is the newest release and GHSA-fc5q-39xc-vjpf covers
        # <=4.0.7, so no patched version exists (transitive: vite/vitest >
        # tinyglobby > fdir). Scoped to that advisory only; remove once a newer
        # picomatch ships and the lockfile can take it.
        run: bun audit --audit-level=high --ignore=GHSA-fc5q-39xc-vjpf
