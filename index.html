<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The media pair is the no-JS fallback: it follows the OS scheme. The
         pre-paint script below rewrites BOTH entries to the resolved ground
         before first paint, so a stored pin that disagrees with the OS cannot
         leave mobile browser chrome on the other palette. src/lib/theme.ts
         keeps the same pair in step when the resolved scheme changes. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F1EC" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101315" />
    <script>
      (function () {
        /* Resolve the stored scheme before paint, so a missing, unrecognized,
           or retired ("auto") value lands on the OS scheme with no FOUC.
           data-theme only ever holds light or dark — CSS has no "auto" branch,
           and src/lib/theme.ts resolves a legacy "auto" exactly this way (an
           unrecognized value is not a pin, so it falls through to the OS).
           Storage and the OS probe are TWO INDEPENDENT try/catches: a storage
           throw (Safari private mode / blocked storage) must never suppress OS
           detection and force a dark-OS visitor onto the light theme. */
        var stored = null;
        try {
          stored = localStorage.getItem("nnl-theme");
        } catch {
          /* storage unavailable — fall through to the OS probe */
        }
        var prefersDark = false;
        try {
          prefersDark =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch {
          /* matchMedia unavailable — treat as light */
        }
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : prefersDark
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        /* Paint the browser chrome the scheme the page actually resolved to.
           Both entries carry the active ground; a meta with no matching media
           would lose to the media pair, so the pair itself is rewritten. */
        var ground = theme === "dark" ? "#101315" : "#F2F1EC";
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) {
          metas[i].setAttribute("content", ground);
        }
      })();
    </script>
