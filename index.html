    <script>
      (function () {
        /* The only pre-paint work left: the motion switch. It is read before
           first paint so a visitor who turned motion off never sees the page
           animate for one frame before the switch is applied — and it is a
           separate try/catch, because storage that throws (Safari private mode,
           a blocked origin) must not stop the attribute being written. An
           absent or unrecognized value means motion is on. */
        var motion = "on";
        try {
          if (localStorage.getItem("nnl-motion") === "off") motion = "off";
        } catch {
          /* storage unavailable — leave motion on */
        }
        document.documentElement.dataset.motion = motion;
      })();
    </script>
