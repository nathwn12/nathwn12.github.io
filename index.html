<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        /* Resolve the stored preference before paint so "auto" (or a missing /
           unrecognized value) lands on the OS scheme with no FOUC. data-theme
           only ever holds the resolved theme — CSS has no "auto" branch.
           Storage and the OS probe are TWO INDEPENDENT try/catches: a storage
           throw (Safari private mode / blocked storage) must never suppress OS
           detection and force a dark-OS visitor onto the light theme. */
        var stored = null;
        try {
          stored = localStorage.getItem("nnl-theme");
        } catch {
          /* storage unavailable — fall through to the OS probe */
        }
        var prefersDark = false;
        try {
          prefersDark =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch {
          /* matchMedia unavailable — treat as light */
        }
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : prefersDark
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
